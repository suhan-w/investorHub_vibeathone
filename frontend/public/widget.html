<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install the widget</title>
    <style>
      body { margin: 0; padding: 20px 16px; font-family: -apple-system, system-ui, sans-serif; background: #f6f5f1; color: #121212; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      ol { padding-left: 20px; line-height: 1.6; font-size: 15px; }
      button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; background: #0f3d3e; color: #fff; margin: 12px 0; }
      textarea { width: 100%; height: 160px; font: 11px ui-monospace, monospace; box-sizing: border-box; }
      #status { text-align: center; font-size: 14px; color: #0a6b2e; min-height: 20px; }
    </style>
  </head>
  <body>
    <h1>Add the home screen widget</h1>
    <button id="copy">Copy widget script</button>
    <div id="status"></div>
    <ol>
      <li>Open <b>Scriptable</b>, tap <b>+</b>, paste, then name it "Before the Bell".</li>
      <li>Tap ▶ once to preview it.</li>
      <li>Long-press the home screen, tap <b>+</b>, add a <b>Scriptable</b> widget (medium).</li>
      <li>Long-press the widget → Edit Widget → Script: <b>Before the Bell</b>.</li>
    </ol>
    <textarea id="src" readonly></textarea>
    <script>
      const src = document.getElementById("src");
      fetch("/widget.js").then((r) => r.text()).then((t) => (src.value = t));
      document.getElementById("copy").onclick = () => {
        // Clipboard API needs https, so fall back to selecting the textarea
        src.focus();
        src.setSelectionRange(0, src.value.length);
        const ok = document.execCommand("copy");
        document.getElementById("status").textContent = ok
          ? "Copied. Now open Scriptable."
          : "Select all in the box below and copy it.";
      };
    </script>
  </body>
</html>
